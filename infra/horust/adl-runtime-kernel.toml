name = "adl-runtime-kernel"
command = "${ADL_RUNTIME_BIN} serve --init ${ADL_RUNTIME_INIT} --continuity-root ${ADL_RUNTIME_CONTINUITY_ROOT}"
stdout = "STDOUT"
stderr = "STDERR"

[restart]
strategy = "on-failure"
backoff = "100ms"
attempts = 3

[failure]
successful-exit-code = [0]
strategy = "ignore"

[environment]
keep-env = false
re-export = ["ADL_RUNTIME_CONTROL_PUBLIC_KEY_HEX", "ADL_RUNTIME_CONTROL_KEY_ID", "ADL_RUNTIME_CONTROL_PRINCIPAL", "ADL_RUNTIME_CONTINUITY_SIGNING_KEY_HEX", "ADL_RUNTIME_CONTINUITY_KEY_ID", "ADL_RUNTIME_CONTINUITY_MIN_GENERATION", "ADL_RUNTIME_OPERATION_PUBLIC_KEY_HEX", "ADL_RUNTIME_OPERATION_KEY_ID", "ADL_RUNTIME_SNTP_SERVER"]

[termination]
signal = "TERM"
wait = "10s"
