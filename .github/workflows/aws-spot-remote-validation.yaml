name: aws-spot-remote-validation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Render the Spot request or launch the AWS Spot remote validation lane"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - start-run
      profile:
        description: "Named shadow workload; custom preserves the generic operator path"
        required: true
        default: "adl-ci"
        type: choice
        options:
          - adl-ci
          - adl-coverage
          - custom
      git_ref:
        description: "Git ref checked out on the remote builder; blank uses this workflow run SHA"
        required: false
        default: ""
      validation_command:
        description: "Remote command used only when profile=custom"
        required: false
        default: ""
      base_ref:
        description: "Base ref for named CI/coverage profiles"
        required: true
        default: "origin/main"
      instance_type:
        description: "Primary EC2 instance type"
        required: true
        default: "m7a.2xlarge"
      builder_image_tag:
        description: "Candidate ECR image tag; keep v0.91.7-fixed until a new tag is verified"
        required: true
        default: "v0.91.7-fixed"

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-spot-remote-validation-ebs-cache
  cancel-in-progress: false

jobs:
  spot-remote-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_SPOT_REMOTE_VALIDATION_REGION: ${{ vars.AWS_SPOT_REMOTE_VALIDATION_REGION || 'us-west-2' }}
      AWS_SPOT_REMOTE_VALIDATION_ROLE_ARN: ${{ secrets.AWS_SPOT_REMOTE_VALIDATION_ROLE_ARN }}
      ADL_AWS_REMOTE_VALIDATION_SSH_ALLOWED_CIDR: ${{ vars.ADL_AWS_REMOTE_VALIDATION_SSH_ALLOWED_CIDR }}
      AWS_SPOT_REMOTE_VALIDATION_SSH_PRIVATE_KEY_B64: ${{ secrets.AWS_SPOT_REMOTE_VALIDATION_SSH_PRIVATE_KEY_B64 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Validate dispatch inputs
        run: |
          case "${{ inputs.mode }}" in
            dry-run|start-run) ;;
            *)
              echo "::error::mode must be dry-run or start-run"
              exit 2
              ;;
          esac
          if [ "${{ inputs.mode }}" = "start-run" ] && [ -z "$AWS_SPOT_REMOTE_VALIDATION_ROLE_ARN" ]; then
            echo "::error::AWS_SPOT_REMOTE_VALIDATION_ROLE_ARN secret is required for live Spot runs"
            exit 2
          fi
          if [ "${{ inputs.mode }}" = "start-run" ] && [ -z "$AWS_SPOT_REMOTE_VALIDATION_SSH_PRIVATE_KEY_B64" ]; then
            echo "::error::AWS_SPOT_REMOTE_VALIDATION_SSH_PRIVATE_KEY_B64 secret is required for live Spot runs"
            exit 2
          fi
          if [ "${{ inputs.git_ref }}" = "HEAD" ]; then
            echo "::error::git_ref must be a branch, tag, or SHA; HEAD is ambiguous"
            exit 2
          fi
          case "${{ inputs.profile }}" in
            adl-ci|adl-coverage) ;;
            custom)
              if [ -z "${{ inputs.validation_command }}" ]; then
                echo "::error::validation_command is required for the custom profile"
                exit 2
              fi
              ;;
            *) echo "::error::unknown Spot shadow profile"; exit 2 ;;
          esac
          if [ "${{ inputs.profile }}" != "custom" ] && [ -n "${{ inputs.validation_command }}" ]; then
            echo "::error::validation_command is available only for the custom profile"
            exit 2
          fi

      - name: Configure Agent Logic AWS credentials
        if: inputs.mode == 'start-run'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_SPOT_REMOTE_VALIDATION_ROLE_ARN }}
          aws-region: ${{ env.AWS_SPOT_REMOTE_VALIDATION_REGION }}
          mask-aws-account-id: true

      - name: Prepare artifact directory
        run: mkdir -p .adl/tmp/aws-spot-remote-validation

      - name: Prepare passphraseless SSH recovery key
        if: inputs.mode == 'start-run'
        env:
          SSH_KEY_PATH: ${{ runner.temp }}/adl-spot-remote-validation.pem
        run: |
          umask 077
          printf '%s' "$AWS_SPOT_REMOTE_VALIDATION_SSH_PRIVATE_KEY_B64" | base64 --decode > "$SSH_KEY_PATH"
          chmod 600 "$SSH_KEY_PATH"
          ssh-keygen -y -P '' -f "$SSH_KEY_PATH" >/dev/null

      - name: Build Spot remote validation binary
        if: inputs.mode == 'start-run'
        run: cargo build --manifest-path tools/aws_remote_validation/Cargo.toml --bin adl-aws-remote-validation

      - name: Render Spot remote validation request
        if: inputs.mode == 'dry-run'
        env:
          GIT_REF: ${{ inputs.git_ref || github.sha }}
          PROFILE: ${{ inputs.profile }}
          CUSTOM_COMMAND: ${{ inputs.validation_command }}
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ inputs.git_ref || github.sha }}
          INSTANCE_TYPE: ${{ inputs.instance_type }}
          BUILDER_IMAGE_TAG: ${{ inputs.builder_image_tag }}
        run: |
          if [ "$PROFILE" = "custom" ]; then
            VALIDATION_COMMAND="$CUSTOM_COMMAND"
          else
            VALIDATION_COMMAND="bash adl/tools/run_aws_spot_ci_profile.sh $PROFILE --base $BASE_REF --head $HEAD_REF"
          fi
          bash adl/tools/run_aws_spot_remote_validation_lane.sh \
            --profile env \
            --region "$AWS_SPOT_REMOTE_VALIDATION_REGION" \
            --git-ref "$GIT_REF" \
            --command "$VALIDATION_COMMAND" \
            --instance-type "$INSTANCE_TYPE" \
            --builder-image-tag "$BUILDER_IMAGE_TAG" \
            --out .adl/tmp/aws-spot-remote-validation/summary.json \
            --artifact-dir .adl/tmp/aws-spot-remote-validation/artifacts \
            --print-command

      - name: Start Spot remote validation
        if: inputs.mode == 'start-run'
        env:
          GIT_REF: ${{ inputs.git_ref || github.sha }}
          PROFILE: ${{ inputs.profile }}
          CUSTOM_COMMAND: ${{ inputs.validation_command }}
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ inputs.git_ref || github.sha }}
          INSTANCE_TYPE: ${{ inputs.instance_type }}
          BUILDER_IMAGE_TAG: ${{ inputs.builder_image_tag }}
          ADL_AWS_REMOTE_VALIDATION_BIN: ${{ github.workspace }}/tools/aws_remote_validation/target/debug/adl-aws-remote-validation
          SSH_KEY_PATH: ${{ runner.temp }}/adl-spot-remote-validation.pem
        run: |
          if [ "$PROFILE" = "custom" ]; then
            VALIDATION_COMMAND="$CUSTOM_COMMAND"
          else
            VALIDATION_COMMAND="bash adl/tools/run_aws_spot_ci_profile.sh $PROFILE --base $BASE_REF --head $HEAD_REF"
          fi
          bash adl/tools/run_aws_spot_remote_validation_lane.sh \
            --run \
            --check-account \
            --profile env \
            --region "$AWS_SPOT_REMOTE_VALIDATION_REGION" \
            --git-ref "$GIT_REF" \
            --command "$VALIDATION_COMMAND" \
            --instance-type "$INSTANCE_TYPE" \
            --builder-image-tag "$BUILDER_IMAGE_TAG" \
            --ssh-private-key-path "$SSH_KEY_PATH" \
            --out .adl/tmp/aws-spot-remote-validation/summary.json \
            --artifact-dir .adl/tmp/aws-spot-remote-validation/artifacts \
            --json

      - name: Spot remote validation summary
        if: always()
        run: |
          {
            echo "## AWS Spot remote validation"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| mode | \`${{ inputs.mode }}\` |"
            echo "| profile | \`${{ inputs.profile }}\` |"
            echo "| builder image tag | \`${{ inputs.builder_image_tag }}\` |"
            echo "| region | \`$AWS_SPOT_REMOTE_VALIDATION_REGION\` |"
            echo "| ebs cache | \`adl-aws-remote-validation-cache-volume:/mnt/adl-cache\` |"
            echo "| ssh tail | \`enabled by wrapper defaults\` |"
            echo "| summary artifact | \`.adl/tmp/aws-spot-remote-validation/summary.json\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Spot artifact redaction
        if: always()
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path(".adl/tmp/aws-spot-remote-validation")
          patterns = [r"\b\d{12}\b", r"arn:aws:", r"\bi-[0-9a-f]{8,17}\b", r"\bvol-[0-9a-f]{8,17}\b"]
          failures = []
          for path in root.rglob("*"):
              if not path.is_file() or ".private" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              if any(re.search(pattern, text) for pattern in patterns):
                  failures.append(str(path))
          if failures:
              raise SystemExit("unredacted Spot artifacts: " + ", ".join(failures))
          PY

      - name: Upload Spot remote validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aws-spot-remote-validation-${{ github.run_id }}
          path: .adl/tmp/aws-spot-remote-validation/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false
