            echo "| selected profile | \`${{ steps.path-policy.outputs.validation_profile_selected }}\` |"
            echo "| profile status | \`${{ steps.path-policy.outputs.validation_profile_status }}\` |"
            echo "| policy coverage lane | \`${{ steps.path-policy.outputs.coverage_lane }}\` |"
            echo "| policy coverage authority | \`${{ steps.path-policy.outputs.coverage_authority }}\` |"
            echo "| policy coverage execution state | \`${{ steps.path-policy.outputs.coverage_execution_state }}\` |"
            echo "| actual adl-coverage execution state | \`${{ steps.path-policy.outputs.coverage_execution_state }}\` |"
            echo "| profile run lanes | \`${{ steps.path-policy.outputs.validation_profile_run_lanes }}\` |"
            echo "| escalation required | \`${{ steps.path-policy.outputs.validation_profile_escalation_required }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: .

      - name: Install Rust toolchain
        if: steps.path-policy.outputs.full_coverage_required == 'true'
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: llvm-tools-preview

      - name: Free runner disk space for coverage
        if: steps.path-policy.outputs.full_coverage_required == 'true'
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          df -h
        working-directory: .

      - name: Rust cache
        if: steps.path-policy.outputs.full_coverage_required == 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            adl -> target
          cache-directories: |
            ~/.cache/sccache

      - name: Install cargo-llvm-cov
        if: steps.path-policy.outputs.full_coverage_required == 'true'
        uses: taiki-e/install-action@e5c52b603cc5f5e9b52b6a43afad8e9fe0527090 # cargo-llvm-cov

      - name: Install cargo-nextest for coverage
        if: steps.path-policy.outputs.full_coverage_required == 'true'
        uses: taiki-e/install-action@50414676f9f5d50a65992c6dd2ed02641263226c # v2.82.10
        with:
          tool: nextest@0.9.140
          fallback: none

      - name: Install sccache for coverage
        if: steps.path-policy.outputs.full_coverage_required == 'true'
        uses: taiki-e/install-action@e5c52b603cc5f5e9b52b6a43afad8e9fe0527090 # install-action
        with:
          tool: sccache

      - name: Install lld for coverage
        if: steps.path-policy.outputs.full_coverage_required == 'true'
        run: bash adl/tools/setup_required_coverage_toolchain.sh install-lld
        working-directory: .

      - name: Configure Rust acceleration for coverage
        if: steps.path-policy.outputs.full_coverage_required == 'true'
        id: coverage-toolchain
        run: |
          bash adl/tools/setup_required_coverage_toolchain.sh configure "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Verify required coverage toolchain
        if: steps.path-policy.outputs.full_coverage_required == 'true'
        run: bash adl/tools/setup_required_coverage_toolchain.sh verify
        working-directory: .

      - name: Coverage not required by path policy
        if: steps.path-policy.outputs.coverage_required != 'true'
        run: |
          echo "Rust coverage execution is not required for this changed surface."
          echo "Policy reason: ${{ steps.path-policy.outputs.reason }}"
          echo "Coverage lane: ${{ steps.path-policy.outputs.coverage_lane }}"
          echo "Coverage authority: ${{ steps.path-policy.outputs.coverage_authority }}"
          echo "Coverage execution state: ${{ steps.path-policy.outputs.coverage_execution_state }}"
      - name: Workspace coverage run and summary (json)
        if: steps.path-policy.outputs.full_coverage_required == 'true'
        env:
          ADL_AUTHORITATIVE_COVERAGE_LCOV_PATH: ${{ github.event_name != 'pull_request' && steps.path-policy.outputs.coverage_authority != 'pr_policy_surface_tooling_only' && 'lcov.info' || '' }}
          ADL_AUTHORITATIVE_COVERAGE_TEXT_SUMMARY_PATH: ${{ github.event_name != 'pull_request' && steps.path-policy.outputs.coverage_authority != 'pr_policy_surface_tooling_only' && 'coverage-summary.txt' || '' }}
          ADL_AUTHORITATIVE_COVERAGE_REPORT_MODE: collect
          ADL_AUTHORITATIVE_COVERAGE_SHARD_COUNT: 4
          ADL_AUTHORITATIVE_COVERAGE_SHARD_INDEX: ${{ matrix.shard }}
          ADL_COVERAGE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-workspace-shard-${{ matrix.shard }}
        run: bash adl/tools/run_ci_step_with_log.sh --name "coverage-workspace-profraw-shard-${{ matrix.shard }}" --log-root ci-step-logs -- bash adl/tools/run_authoritative_coverage_lane.sh --profile workspace --authority "${{ steps.path-policy.outputs.coverage_authority }}" --event-name "${{ github.event_name }}"
        working-directory: .

      - name: Write workspace coverage provenance
        if: always()
        env:
          COVERAGE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COVERAGE_RUN_ID: ${{ github.run_id }}
          COVERAGE_RUN_ATTEMPT: ${{ github.run_attempt }}
          COVERAGE_SHARD: ${{ matrix.shard }}
          COVERAGE_SHARD_COUNT: 4
        run: |
          python3 -c 'import json, os, pathlib; pathlib.Path("adl/coverage-provenance.workspace.json").write_text(json.dumps({"head_sha": os.environ["COVERAGE_HEAD_SHA"], "profile": "workspace", "run_id": os.environ["COVERAGE_RUN_ID"], "run_attempt": os.environ["COVERAGE_RUN_ATTEMPT"], "shard": os.environ["COVERAGE_SHARD"], "shard_count": os.environ["COVERAGE_SHARD_COUNT"]}, sort_keys=True) + "\n")'
        working-directory: .

      - name: Upload workspace coverage shard profiles
        if: always() && steps.path-policy.outputs.full_coverage_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adl-coverage-workspace-profraw-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            adl/target/llvm-cov-target/${{ github.run_id }}-${{ github.run_attempt }}-workspace-shard-${{ matrix.shard }}/workspace/*.profraw
            adl/coverage-provenance.workspace.json
            ci-step-logs/
          if-no-files-found: error
          retention-days: 14

      - name: Coverage policy annotation
        if: steps.path-policy.outputs.coverage_required != 'true'
        run: |
          echo "Path policy did not require Rust coverage for these changed paths."
          echo "The authoritative coverage command did not run in this job because coverage_required != true."
          echo "Policy reason: ${{ steps.path-policy.outputs.reason }}"
          echo "Coverage lane requested by policy: ${{ steps.path-policy.outputs.coverage_lane }}"
          echo "Coverage authority requested by policy: ${{ steps.path-policy.outputs.coverage_authority }}"
          echo "Actual adl-coverage execution state: skipped_by_path_policy"
        working-directory: .

      - name: Rust acceleration stats for coverage
        if: always() && steps.coverage-toolchain.outputs.ready == 'true'
        run: bash adl/tools/setup_required_coverage_toolchain.sh stats
        working-directory: .

  adl_coverage_hosted:
    name: adl-coverage-hosted
    needs:
      - adl_path_policy
      - adl_coverage_runtime_hosted
      - adl_coverage_workspace_fast_hosted
      - adl_coverage_workspace_hosted
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      route_result: ${{ steps.producer-results.outputs.route_result }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Verify hosted coverage producer results
        id: producer-results
        env:
          BACKEND: ${{ needs.adl_path_policy.outputs.heavy_ci_backend }}
          COVERAGE_REQUIRED: ${{ needs.adl_path_policy.outputs.coverage_required }}
          FULL_COVERAGE_REQUIRED: ${{ needs.adl_path_policy.outputs.full_coverage_required }}
          PATH_POLICY_RESULT: ${{ needs.adl_path_policy.result }}
          RUNTIME_RESULT: ${{ needs.adl_coverage_runtime_hosted.result }}
          WORKSPACE_FAST_RESULT: ${{ needs.adl_coverage_workspace_fast_hosted.result }}
          WORKSPACE_RESULT: ${{ needs.adl_coverage_workspace_hosted.result }}
          SAME_REPO_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          SPOT_OPT_IN: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:spot') }}
        run: |
          set -euo pipefail
          if [ "$PATH_POLICY_RESULT" != success ]; then
            echo "::error::coverage path policy result $PATH_POLICY_RESULT; expected success"
            exit 1
          fi
          hosted_required=false
          if [ "$COVERAGE_REQUIRED" = true ] && ! { [ "$BACKEND" = spot ] && [ "$SAME_REPO_PR" = true ] && [ "$SPOT_OPT_IN" = true ]; }; then
            hosted_required=true
          fi
          expected_workspace=skipped
          expected_workspace_fast=skipped
          expected_runtime=skipped
          if [ "$hosted_required" = true ]; then
            if [ "$FULL_COVERAGE_REQUIRED" = true ]; then
              expected_workspace=success
              expected_runtime=success
            else
              expected_workspace_fast=success
            fi
          fi
          if [ "$WORKSPACE_RESULT" != "$expected_workspace" ]; then
            echo "::error::workspace coverage producer result $WORKSPACE_RESULT; expected $expected_workspace"
            exit 1
          fi
          if [ "$WORKSPACE_FAST_RESULT" != "$expected_workspace_fast" ]; then
            echo "::error::workspace fast coverage producer result $WORKSPACE_FAST_RESULT; expected $expected_workspace_fast"
            exit 1
          fi
          if [ "$RUNTIME_RESULT" != "$expected_runtime" ]; then
            echo "::error::runtime coverage producer result $RUNTIME_RESULT; expected $expected_runtime"
            exit 1
          fi
          if [ "$hosted_required" = true ]; then
            echo "route_result=success" >> "$GITHUB_OUTPUT"
          else
            echo "route_result=skipped" >> "$GITHUB_OUTPUT"
          fi

      - name: Download runtime coverage evidence
        if: needs.adl_coverage_runtime_hosted.result == 'success'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v8.0.1
        with:
          name: adl-coverage-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage-artifacts/runtime

      - name: Download workspace coverage evidence
        if: needs.adl_coverage_workspace_fast_hosted.result == 'success'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v8.0.1
        with:
          name: adl-coverage-workspace-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage-artifacts/workspace

      - name: Download workspace coverage shard profiles
        if: needs.adl_coverage_workspace_hosted.result == 'success' && needs.adl_path_policy.outputs.full_coverage_required == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v8.0.1
        with:
          pattern: adl-coverage-workspace-profraw-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: coverage-artifacts/workspace-profraw

      - name: Install Rust toolchain for coverage aggregation
        if: needs.adl_coverage_workspace_hosted.result == 'success' && needs.adl_path_policy.outputs.full_coverage_required == 'true'
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: llvm-tools-preview

      - name: Rust cache for coverage aggregation
        if: needs.adl_coverage_workspace_hosted.result == 'success' && needs.adl_path_policy.outputs.full_coverage_required == 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            adl -> target
          cache-directories: |
            ~/.cache/sccache

      - name: Install cargo-llvm-cov for coverage aggregation
        if: needs.adl_coverage_workspace_hosted.result == 'success' && needs.adl_path_policy.outputs.full_coverage_required == 'true'
        uses: taiki-e/install-action@e5c52b603cc5f5e9b52b6a43afad8e9fe0527090 # cargo-llvm-cov

      - name: Install cargo-nextest for coverage aggregation
        if: needs.adl_coverage_workspace_hosted.result == 'success' && needs.adl_path_policy.outputs.full_coverage_required == 'true'
        uses: taiki-e/install-action@50414676f9f5d50a65992c6dd2ed02641263226c # v2.82.10
        with:
          tool: nextest@0.9.140
          fallback: none

      - name: Install sccache for coverage aggregation
        if: needs.adl_coverage_workspace_hosted.result == 'success' && needs.adl_path_policy.outputs.full_coverage_required == 'true'
        uses: taiki-e/install-action@e5c52b603cc5f5e9b52b6a43afad8e9fe0527090 # install-action
        with:
          tool: sccache

      - name: Install lld for coverage aggregation
        if: needs.adl_coverage_workspace_hosted.result == 'success' && needs.adl_path_policy.outputs.full_coverage_required == 'true'
        run: bash adl/tools/setup_required_coverage_toolchain.sh install-lld
        working-directory: .

      - name: Configure Rust acceleration for coverage aggregation
        if: needs.adl_coverage_workspace_hosted.result == 'success' && needs.adl_path_policy.outputs.full_coverage_required == 'true'
        run: bash adl/tools/setup_required_coverage_toolchain.sh configure "$GITHUB_ENV"
        working-directory: .

      - name: Verify required coverage aggregation toolchain
        if: needs.adl_coverage_workspace_hosted.result == 'success' && needs.adl_path_policy.outputs.full_coverage_required == 'true'
        run: bash adl/tools/setup_required_coverage_toolchain.sh verify
        working-directory: .

      - name: Verify hosted coverage provenance
        if: needs.adl_coverage_workspace_hosted.result == 'success' || needs.adl_coverage_workspace_fast_hosted.result == 'success'
        env:
          COVERAGE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COVERAGE_RUN_ID: ${{ github.run_id }}
          COVERAGE_RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNTIME_REQUIRED: ${{ needs.adl_path_policy.outputs.full_coverage_required }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def verify(path, profile, extra=None):
              document = json.loads(path.read_text(encoding="utf-8"))
              expected = {"head_sha": os.environ["COVERAGE_HEAD_SHA"], "profile": profile, "run_id": os.environ["COVERAGE_RUN_ID"]}
              if extra:
                  expected.update(extra)
              if document != expected:
                  raise SystemExit(f"coverage provenance mismatch for {profile}: {document!r} != {expected!r}")

          if os.environ["RUNTIME_REQUIRED"] == "true":
              workspace_root = Path("coverage-artifacts/workspace-profraw")
              provenances = sorted(workspace_root.rglob("coverage-provenance.workspace.json"))
              if len(provenances) != 4:
                  raise SystemExit(f"expected 4 workspace shard provenance files, found {len(provenances)}")
              profraw_by_shard = {}
              seen_shards = set()
              for provenance in provenances:
                  document = json.loads(provenance.read_text(encoding="utf-8"))
                  shard = document.get("shard")
                  expected = {
                      "head_sha": os.environ["COVERAGE_HEAD_SHA"],
                      "profile": "workspace",
                      "run_id": os.environ["COVERAGE_RUN_ID"],
                      "run_attempt": os.environ["COVERAGE_RUN_ATTEMPT"],
                      "shard": shard,
                      "shard_count": "4",
                  }
                  if document != expected:
                      raise SystemExit(f"workspace shard provenance mismatch: {document!r} != {expected!r}")
                  seen_shards.add(shard)
                  profraw_by_shard[shard] = list(provenance.parent.rglob("*.profraw"))
              if seen_shards != {"1", "2", "3", "4"}:
                  raise SystemExit(f"workspace shard provenance set mismatch: {sorted(seen_shards)!r}")
              missing = sorted(shard for shard, profiles in profraw_by_shard.items() if not profiles)
              if missing:
                  raise SystemExit(f"workspace shard profraw profiles missing for shard(s): {missing!r}")
              runtime = Path("coverage-artifacts/runtime/adl")
              verify(runtime / "coverage-provenance.adl-runtime.json", "adl-runtime")
              if not (runtime / "coverage-summary.adl-runtime.json").is_file():
                  raise SystemExit("runtime coverage summary is missing")
          else:
              workspace = Path("coverage-artifacts/workspace/adl")
              verify(workspace / "coverage-provenance.workspace.json", "workspace", {"run_attempt": os.environ["COVERAGE_RUN_ATTEMPT"]})
          PY

      - name: Aggregate workspace coverage shard profiles
        if: needs.adl_path_policy.outputs.full_coverage_required == 'true' && needs.adl_coverage_workspace_hosted.result == 'success'
        env:
          ADL_AUTHORITATIVE_COVERAGE_REPORT_MODE: report
          ADL_AUTHORITATIVE_COVERAGE_IMPORT_PROFRAW_DIR: ${{ github.workspace }}/coverage-artifacts/workspace-profraw
          ADL_AUTHORITATIVE_COVERAGE_LCOV_PATH: ${{ github.event_name != 'pull_request' && needs.adl_path_policy.outputs.coverage_authority != 'pr_policy_surface_tooling_only' && 'lcov.info' || '' }}
          ADL_AUTHORITATIVE_COVERAGE_TEXT_SUMMARY_PATH: ${{ github.event_name != 'pull_request' && needs.adl_path_policy.outputs.coverage_authority != 'pr_policy_surface_tooling_only' && 'coverage-summary.txt' || '' }}
          ADL_COVERAGE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-workspace-aggregate
        run: bash adl/tools/run_ci_step_with_log.sh --name "coverage-workspace-aggregate-summary-json" --log-root ci-step-logs -- bash adl/tools/run_authoritative_coverage_lane.sh --profile workspace --authority "${{ needs.adl_path_policy.outputs.coverage_authority }}" --event-name "${{ github.event_name }}"
        working-directory: .

      - name: Merge isolated coverage summaries
        if: needs.adl_path_policy.outputs.full_coverage_required == 'true' && needs.adl_coverage_runtime_hosted.result == 'success' && needs.adl_coverage_workspace_hosted.result == 'success'
        run: |
          python3 adl/tools/merge_coverage_summaries.py \
            --workspace adl/coverage-summary.adl.json \
            --adl-runtime coverage-artifacts/runtime/adl/coverage-summary.adl-runtime.json \
            --output adl/coverage-summary.json

      - name: Coverage-impact changed-source gate
        if: github.event_name == 'pull_request' && needs.adl_path_policy.outputs.full_coverage_required == 'true' && needs.adl_coverage_workspace_hosted.result == 'success'
        env:
          PER_FILE_LINE_THRESHOLD: "80"
        run: |
          bash adl/tools/check_coverage_impact.sh \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --summary adl/coverage-summary.json \
            --threshold "$PER_FILE_LINE_THRESHOLD"

      - name: PR coverage-impact preflight
        if: github.event_name == 'pull_request' && needs.adl_path_policy.outputs.coverage_required == 'true' && needs.adl_path_policy.outputs.full_coverage_required != 'true' && needs.adl_coverage_workspace_fast_hosted.result == 'success'
        env:
          PER_FILE_LINE_THRESHOLD: "80"
        run: |
          set -euo pipefail
          args=(
            --base "${{ github.event.pull_request.base.sha }}"
            --head "${{ github.event.pull_request.head.sha }}"
            --threshold "$PER_FILE_LINE_THRESHOLD"
          )
          if [ -s coverage-artifacts/workspace/adl/target/coverage-impact-summary.json ]; then
            args+=(--summary coverage-artifacts/workspace/adl/target/coverage-impact-summary.json)
          else
            args+=(--require-summary-for-risk)
          fi
          bash adl/tools/check_coverage_impact.sh "${args[@]}"

      - name: Enforce coverage policy gates (workspace + per-file)
        if: github.event_name != 'pull_request' && needs.adl_path_policy.outputs.full_coverage_required == 'true' && needs.adl_path_policy.outputs.coverage_authority != 'pr_policy_surface_tooling_only' && needs.adl_coverage_workspace_hosted.result == 'success'
        env:
          WORKSPACE_LINE_THRESHOLD: "90"
          PER_FILE_LINE_THRESHOLD: "80"
          EXCLUDE_FROM_FILE_FLOOR_REGEX: 'adl/src/runtime_v2/(a2a_adapter_boundary|access_control|acip_hardening|challenge|contract_registry_accessors)\.rs$'
        run: |
          set -eu
          bash adl/tools/enforce_coverage_gates.sh adl/coverage-summary.json

      - name: Full workspace coverage gate deferred for PR
        if: github.event_name == 'pull_request' && needs.adl_path_policy.outputs.full_coverage_required == 'true' && needs.adl_coverage_workspace_hosted.result == 'success'
        run: |
          echo "Workspace coverage gate and lcov artifact generation are deferred for pull requests."
          echo "This PR ran isolated workspace and runtime coverage plus changed-source coverage-impact validation."
          echo "Full workspace coverage gating remains required on push-to-main, nightly ratchet, and non-PR fail-closed events."
          echo "Policy reason: ${{ needs.adl_path_policy.outputs.reason }}"
          echo "Coverage lane: ${{ needs.adl_path_policy.outputs.coverage_lane }}"
          echo "Coverage authority: ${{ needs.adl_path_policy.outputs.coverage_authority }}"

      - name: Verify generated lcov file
        if: github.event_name != 'pull_request' && needs.adl_path_policy.outputs.full_coverage_required == 'true' && needs.adl_path_policy.outputs.coverage_authority != 'pr_policy_surface_tooling_only' && needs.adl_coverage_workspace_hosted.result == 'success'
        run: test -s lcov.info && ls -l lcov.info
        working-directory: adl

      - name: Verify lcov path from repository root
        if: github.event_name != 'pull_request' && needs.adl_path_policy.outputs.full_coverage_required == 'true' && needs.adl_path_policy.outputs.coverage_authority != 'pr_policy_surface_tooling_only' && needs.adl_coverage_workspace_hosted.result == 'success'
        run: test -s adl/lcov.info && ls -l adl/lcov.info
        working-directory: .

      - name: Coverage artifact publication boundary
        if: needs.adl_coverage_workspace_hosted.result == 'success'
        run: |
          echo "Coverage artifacts are CI/operator review surfaces."
          echo "Normalize runner-local paths and run redaction/publication review before reusing them in publication-adjacent or customer-facing packets."
        working-directory: .

      - name: Validation profile summary (adl-coverage)
        run: |
          {
            echo "## ADL coverage validation profile"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| reason | \`${{ needs.adl_path_policy.outputs.reason }}\` |"
            echo "| selected profile | \`${{ needs.adl_path_policy.outputs.validation_profile_selected }}\` |"
            echo "| profile status | \`${{ needs.adl_path_policy.outputs.validation_profile_status }}\` |"
            echo "| policy coverage lane | \`${{ needs.adl_path_policy.outputs.coverage_lane }}\` |"
            echo "| policy coverage authority | \`${{ needs.adl_path_policy.outputs.coverage_authority }}\` |"
            echo "| workspace producer | \`${{ needs.adl_coverage_workspace_hosted.result }}\` |"
            echo "| workspace fast producer | \`${{ needs.adl_coverage_workspace_fast_hosted.result }}\` |"
            echo "| runtime producer | \`${{ needs.adl_coverage_runtime_hosted.result }}\` |"
            echo "| profile run lanes | \`${{ needs.adl_path_policy.outputs.validation_profile_run_lanes }}\` |"
            echo "| escalation required | \`${{ needs.adl_path_policy.outputs.validation_profile_escalation_required }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.adl_path_policy.outputs.full_coverage_required == 'true' && needs.adl_coverage_workspace_hosted.result == 'success'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: adl/lcov.info
          flags: adl
          fail_ci_if_error: false
          verbose: true

  adl-coverage:
    name: adl-coverage
    needs:
      - adl_path_policy
      - adl_coverage_hosted
      - adl_spot_ci_and_coverage
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository for route verification
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Aggregate hosted or Spot coverage lane
        env:
          BACKEND: ${{ needs.adl_path_policy.outputs.heavy_ci_backend }}
          EVENT_NAME: ${{ github.event_name }}
          SAME_REPO_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          SPOT_OPT_IN: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:spot') }}
          WORK_REQUIRED: ${{ needs.adl_path_policy.outputs.coverage_required == 'true' }}
          SPOT_WORK_REQUIRED: ${{ needs.adl_path_policy.outputs.coverage_required == 'true' }}
        run: |
          set -euo pipefail
          python3 adl/tools/verify_ci_backend_route.py \
            --surface adl-coverage \
            --backend "$BACKEND" \
            --event-name "$EVENT_NAME" \
            --same-repo-pr "$SAME_REPO_PR" \
            --spot-opt-in "$SPOT_OPT_IN" \
            --work-required "$WORK_REQUIRED" \
            --spot-work-required "$SPOT_WORK_REQUIRED" \
            --path-policy-result "${{ needs.adl_path_policy.result }}" \
            --spot-result "${{ needs.adl_spot_ci_and_coverage.result }}" \
            --hosted-result "coverage=${{ needs.adl_coverage_hosted.outputs.route_result }}"
          failed=""
          for lane in \
            "adl_path_policy:${{ needs.adl_path_policy.result }}" \
            "adl_coverage_hosted:${{ needs.adl_coverage_hosted.result }}" \
            "adl_spot_ci_and_coverage:${{ needs.adl_spot_ci_and_coverage.result }}"
          do
            name="${lane%%:*}"
            result="${lane#*:}"
            echo "$name => $result"
            case "$result" in
              success|skipped) ;;
              *) failed="${failed}${failed:+, }${name}=${result}" ;;
            esac
          done
          if [ -n "$failed" ]; then
            echo "::error::adl-coverage lane failure(s): $failed"
            exit 1
          fi
