name: ci

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  adl_path_policy:
    name: adl-path-policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      reason: ${{ steps.path-policy.outputs.reason }}
      rust_required: ${{ steps.path-policy.outputs.rust_required }}
      coverage_required: ${{ steps.path-policy.outputs.coverage_required }}
      full_coverage_required: ${{ steps.path-policy.outputs.full_coverage_required }}
      demo_smoke_required: ${{ steps.path-policy.outputs.demo_smoke_required }}
      v0913_proof_required: ${{ steps.path-policy.outputs.v0913_proof_required }}
      release_version_only: ${{ steps.path-policy.outputs.release_version_only }}
      ci_contracts_required: ${{ steps.path-policy.outputs.ci_contracts_required }}
      ci_path_policy_contracts_required: ${{ steps.path-policy.outputs.ci_path_policy_contracts_required }}
      ci_contract_toolchain_required: ${{ steps.path-policy.outputs.ci_contract_toolchain_required }}
      pvf_ci_release_contract_required: ${{ steps.path-policy.outputs.pvf_ci_release_contract_required }}
      v0913_proof_contract_required: ${{ steps.path-policy.outputs.v0913_proof_contract_required }}
      slow_proof_contract_required: ${{ steps.path-policy.outputs.slow_proof_contract_required }}
      skill_author_contracts_required: ${{ steps.path-policy.outputs.skill_author_contracts_required }}
      coverage_lane: ${{ steps.path-policy.outputs.coverage_lane }}
      coverage_authority: ${{ steps.path-policy.outputs.coverage_authority }}
      coverage_execution_state: ${{ steps.path-policy.outputs.coverage_execution_state }}
      proof_validation_scope: ${{ steps.path-policy.outputs.proof_validation_scope }}
      validation_profile_selected: ${{ steps.path-policy.outputs.validation_profile_selected }}
      validation_profile_status: ${{ steps.path-policy.outputs.validation_profile_status }}
      validation_profile_pr_publication_sufficient: ${{ steps.path-policy.outputs.validation_profile_pr_publication_sufficient }}
      validation_profile_escalation_required: ${{ steps.path-policy.outputs.validation_profile_escalation_required }}
      validation_profile_run_lanes: ${{ steps.path-policy.outputs.validation_profile_run_lanes }}
      validation_profile_primary_reason: ${{ steps.path-policy.outputs.validation_profile_primary_reason }}
      validation_profile_escalation_lanes: ${{ steps.path-policy.outputs.validation_profile_escalation_lanes }}
      runtime_v3_fast_required: ${{ steps.path-policy.outputs.runtime_v3_fast_required }}
      heavy_ci_backend: ${{ steps.path-policy.outputs.heavy_ci_backend }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: path-policy
        env:
          HEAVY_CI_BACKEND: ${{ vars.ADL_HEAVY_CI_BACKEND || 'hosted' }}
        run: |
          bash adl/tools/ci_path_policy.sh \
            --event-name "${{ github.event_name }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --ref "${{ github.ref }}" \
            --github-output "$GITHUB_OUTPUT"
          backend="${HEAVY_CI_BACKEND:-hosted}"
          case "$backend" in
            hosted|spot) ;;
            *)
              echo "::error::ADL_HEAVY_CI_BACKEND must be hosted or spot, got: $backend"
              exit 1
              ;;
          esac
          echo "heavy_ci_backend=$backend" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Validation profile summary (adl-ci)
        run: |
          {
            echo "## ADL validation profile"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| reason | \`${{ steps.path-policy.outputs.reason }}\` |"
            echo "| selected profile | \`${{ steps.path-policy.outputs.validation_profile_selected }}\` |"
            echo "| profile status | \`${{ steps.path-policy.outputs.validation_profile_status }}\` |"
            echo "| PR publication sufficient | \`${{ steps.path-policy.outputs.validation_profile_pr_publication_sufficient }}\` |"
            echo "| profile run lanes | \`${{ steps.path-policy.outputs.validation_profile_run_lanes }}\` |"
            echo "| escalation required | \`${{ steps.path-policy.outputs.validation_profile_escalation_required }}\` |"
            echo "| escalation lanes | \`${{ steps.path-policy.outputs.validation_profile_escalation_lanes }}\` |"
            echo "| CI path-policy contracts | \`${{ steps.path-policy.outputs.ci_path_policy_contracts_required }}\` |"
            echo "| CI contract toolchain | \`${{ steps.path-policy.outputs.ci_contract_toolchain_required }}\` |"
            echo "| skill author contracts | \`${{ steps.path-policy.outputs.skill_author_contracts_required }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: .

  adl_tooling_contracts:
    name: adl-tooling-contracts
    needs: adl_path_policy
    if: needs.adl_path_policy.outputs.runtime_v3_fast_required != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install cargo-llvm-cov for CI contract checks
        if: needs.adl_path_policy.outputs.ci_contract_toolchain_required == 'true'
        uses: taiki-e/install-action@e5c52b603cc5f5e9b52b6a43afad8e9fe0527090 # cargo-llvm-cov

      - name: Install cargo-nextest for CI contract checks
        if: needs.adl_path_policy.outputs.ci_contract_toolchain_required == 'true'
        uses: taiki-e/install-action@e5c52b603cc5f5e9b52b6a43afad8e9fe0527090 # install-action
        with:
          tool: nextest@0.9.140

      - name: tooling sanity (bash -n)
        run: bash -n adl/tools/*.sh

      - name: tooling sanity (codex_pr help)
        run: |
          if bash adl/tools/codex_pr.sh --help >/tmp/codex_pr_help.out 2>/tmp/codex_pr_help.err; then
            rc=0
          else
            rc=$?
          fi
          test "$rc" -eq 2
          grep -q "retired and now fails closed" /tmp/codex_pr_help.err

      - name: tooling sanity (codexw help)
        run: |
          if bash adl/tools/codexw.sh --help >/tmp/codexw_help.out 2>/tmp/codexw_help.err; then
            rc=0
          else
            rc=$?
          fi
          test "$rc" -eq 2
          grep -q "retired and now fails closed" /tmp/codexw_help.err

      - name: coverage-impact preflight contract
        run: bash adl/tools/test_check_coverage_impact.sh

      - name: path-policy PR-fast coverage contract
        run: bash adl/tools/test_ci_path_policy.sh

      - name: PVF CI release policy contract
        if: needs.adl_path_policy.outputs.pvf_ci_release_contract_required == 'true'
        run: bash adl/tools/test_pvf_ci_release_policy.sh

      - name: tracked proof-validation lane contract
        if: needs.adl_path_policy.outputs.v0913_proof_contract_required == 'true'
        env:
          RUSTFLAGS: ""
          RUST_LINK_ACCEL: system
        run: bash adl/tools/test_run_v0913_proof_validation_lane.sh

      - name: PR-fast test lane contract
        if: needs.adl_path_policy.outputs.ci_path_policy_contracts_required == 'true' || needs.adl_path_policy.outputs.rust_required == 'true'
        run: bash adl/tools/test_run_pr_fast_test_lane.sh

      - name: slow-proof lane contract
        if: needs.adl_path_policy.outputs.slow_proof_contract_required == 'true'
        run: bash adl/tools/test_slow_proof_lane_contract.sh

      - name: authoritative coverage lane contract
        if: needs.adl_path_policy.outputs.ci_path_policy_contracts_required == 'true' || needs.adl_path_policy.outputs.full_coverage_required == 'true'
        run: bash adl/tools/test_run_authoritative_coverage_lane.sh

      - name: guardrail (no new legacy refs)
        run: bash adl/tools/check_no_new_legacy_swarm_refs.sh

      - name: guardrail contract (issue PR closing linkage)
        if: hashFiles('adl/tools/test_pr_closing_linkage.sh') != ''
        run: bash adl/tools/test_pr_closing_linkage.sh

      - name: guardrail contract (final merge gate)
        run: bash adl/tools/test_ensure_final_merge_gate.sh

      - name: guardrail (issue PR closing linkage)
        if: hashFiles('adl/tools/check_pr_closing_linkage.sh') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash adl/tools/check_pr_closing_linkage.sh

      - name: repo-code-review contract check
        if: needs.adl_path_policy.outputs.skill_author_contracts_required == 'true'
        run: bash adl/tools/test_repo_code_review_skill_contracts.sh

      - name: test-generator contract check
        if: needs.adl_path_policy.outputs.skill_author_contracts_required == 'true'
        run: bash adl/tools/test_test_generator_skill_contracts.sh

      - name: demo-operator contract check
        if: needs.adl_path_policy.outputs.skill_author_contracts_required == 'true'
        run: bash adl/tools/test_demo_operator_skill_contracts.sh

      - name: arxiv-paper-writer contract check
        if: needs.adl_path_policy.outputs.skill_author_contracts_required == 'true'
        run: bash adl/tools/test_arxiv_paper_writer_skill_contracts.sh

      - name: ANRM/Gemma trace dataset tooling check
        if: needs.adl_path_policy.outputs.skill_author_contracts_required == 'true'
        run: bash adl/tools/test_build_v0911_anrm_trace_dataset.sh

      - name: CI contract checks skipped by path policy
        if: needs.adl_path_policy.outputs.ci_contracts_required != 'true'
        run: |
          echo "Runtime-compiling CI contract checks skipped because changed paths qualify for the minimal docs/release lane."
          echo "Policy reason: ${{ needs.adl_path_policy.outputs.reason }}"
          echo "ci_contracts_required=${{ needs.adl_path_policy.outputs.ci_contracts_required }}"

      - name: docs command check
        run: bash adl/tools/check_release_notes_commands.sh
        working-directory: .

      - name: ci runtime contract check
        if: needs.adl_path_policy.outputs.ci_path_policy_contracts_required == 'true'
        run: bash adl/tools/test_ci_runtime_contracts.sh
        working-directory: .

      - name: ci runtime budget report contract check
        if: needs.adl_path_policy.outputs.ci_path_policy_contracts_required == 'true'
        run: bash adl/tools/test_summarize_ci_runtime.sh
        working-directory: .

      - name: ci cache/linker contract check
        if: needs.adl_path_policy.outputs.ci_path_policy_contracts_required == 'true'
        run: bash adl/tools/test_ci_cache_linker_contracts.sh
        working-directory: .

      - name: release version truth check
        if: needs.adl_path_policy.outputs.release_version_only == 'true'
        run: bash adl/tools/check_release_version_surfaces.sh
        working-directory: .

  adl_runtime_v3_fast:
    name: adl-runtime-v3-fast
    needs: adl_path_policy
    if: needs.adl_path_policy.outputs.runtime_v3_fast_required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: |
            adl-runtime-kernel -> target

      - name: Runtime v3 focused tests
        run: cargo test --manifest-path adl-runtime-kernel/Cargo.toml

      - name: Runtime v3 focused clippy
        run: cargo clippy --manifest-path adl-runtime-kernel/Cargo.toml --all-targets -- -D warnings

      - name: Runtime v3 Observatory proof
        run: bash adl/tools/test_v0917_html_observatory_integrated_proof.sh

  adl_rust_fmt_clippy:
    name: adl-rust-fmt-clippy
    needs: adl_path_policy
    if: needs.adl_path_policy.outputs.rust_required == 'true' && needs.adl_path_policy.outputs.runtime_v3_fast_required != 'true' && (needs.adl_path_policy.outputs.heavy_ci_backend != 'spot' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !contains(github.event.pull_request.labels.*.name, 'ci:spot'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: adl
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          df -h
        working-directory: .

      - name: Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: |
            adl -> target
          cache-directories: |
            ~/.cache/sccache

      - name: Install sccache
        uses: taiki-e/install-action@e5c52b603cc5f5e9b52b6a43afad8e9fe0527090 # install-action
        with:
          tool: sccache

      - name: Install lld
        run: bash adl/tools/setup_required_coverage_toolchain.sh install-lld
        working-directory: .

      - name: Configure Rust acceleration
        run: |
          mkdir -p "$HOME/.cache/sccache"
          echo "SCCACHE_DIR=$HOME/.cache/sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=2G" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          if ! command -v ld.lld >/dev/null 2>&1; then
            echo "::error::ld.lld is unavailable after the install step"
            exit 1
          fi
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"
          echo "RUST_LINK_ACCEL=lld" >> "$GITHUB_ENV"
          sccache --zero-stats || true

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust acceleration stats
        if: always()
        run: |
          echo "Linker mode: ${RUST_LINK_ACCEL:-unknown}"
          sccache --show-stats || true

  adl_rust_tests:
    name: adl-rust-tests
    needs: adl_path_policy
    if: needs.adl_path_policy.outputs.rust_required == 'true' && needs.adl_path_policy.outputs.runtime_v3_fast_required != 'true' && (needs.adl_path_policy.outputs.heavy_ci_backend != 'spot' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !contains(github.event.pull_request.labels.*.name, 'ci:spot'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: adl
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: llvm-tools-preview

      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          df -h
        working-directory: .

      - name: Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: |
            adl -> target
          cache-directories: |
            ~/.cache/sccache

      - name: Install sccache
        uses: taiki-e/install-action@e5c52b603cc5f5e9b52b6a43afad8e9fe0527090 # install-action
        with:
          tool: sccache

      - name: Install lld
        run: bash adl/tools/setup_required_coverage_toolchain.sh install-lld
        working-directory: .

      - name: Configure Rust acceleration
        run: |
          mkdir -p "$HOME/.cache/sccache"
          echo "SCCACHE_DIR=$HOME/.cache/sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=2G" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          if ! command -v ld.lld >/dev/null 2>&1; then
            echo "::error::ld.lld is unavailable after the install step"
            exit 1
          fi
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"
          echo "RUST_LINK_ACCEL=lld" >> "$GITHUB_ENV"
          sccache --zero-stats || true

      - name: Install cargo-nextest
        if: needs.adl_path_policy.outputs.full_coverage_required != 'true'
        uses: taiki-e/install-action@e5c52b603cc5f5e9b52b6a43afad8e9fe0527090 # install-action
        with:
          tool: nextest@0.9.140

      - name: test
        if: needs.adl_path_policy.outputs.full_coverage_required != 'true' && needs.adl_path_policy.outputs.validation_profile_escalation_required != 'true'
        run: bash adl/tools/run_pr_fast_test_lane.sh --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
        working-directory: .

      - name: test deferred to validation-manager escalation
        if: needs.adl_path_policy.outputs.full_coverage_required != 'true' && needs.adl_path_policy.outputs.validation_profile_escalation_required == 'true'
        run: |
          echo "Ordinary PR-fast Rust test lane deferred because the validation manager selected an escalation profile."
          echo "Selected profile: ${{ needs.adl_path_policy.outputs.validation_profile_selected }}"
          echo "Profile status: ${{ needs.adl_path_policy.outputs.validation_profile_status }}"
          echo "PR publication sufficient: ${{ needs.adl_path_policy.outputs.validation_profile_pr_publication_sufficient }}"
          echo "Run lanes: ${{ needs.adl_path_policy.outputs.validation_profile_run_lanes }}"
          echo "Escalation lanes: ${{ needs.adl_path_policy.outputs.validation_profile_escalation_lanes }}"
          echo "Reason: ${{ needs.adl_path_policy.outputs.validation_profile_primary_reason }}"
        working-directory: .

      - name: doc test
        if: needs.adl_path_policy.outputs.full_coverage_required != 'true'
        run: cargo test --doc

      - name: test covered by full coverage lane
        if: needs.adl_path_policy.outputs.full_coverage_required == 'true'
        run: |
          echo "Skipping standalone cargo nextest/doc-test lane because this event requires the full cargo-llvm-cov lane."
          echo "Policy reason: ${{ needs.adl_path_policy.outputs.reason }}"
          echo "Coverage lane: ${{ needs.adl_path_policy.outputs.coverage_lane }}"
          echo "Coverage authority: ${{ needs.adl_path_policy.outputs.coverage_authority }}"

      - name: release-version Rust lane replacement
        if: needs.adl_path_policy.outputs.release_version_only == 'true'
        run: |
          echo "Ordinary Rust fmt/clippy/test is replaced by the bounded release-version truth check for this PR."
          echo "Policy reason: ${{ needs.adl_path_policy.outputs.reason }}"
          echo "Coverage lane: ${{ needs.adl_path_policy.outputs.coverage_lane }}"
          echo "Coverage authority: ${{ needs.adl_path_policy.outputs.coverage_authority }}"
        working-directory: .

      - name: Rust acceleration stats
        if: always()
        run: |
          echo "Linker mode: ${RUST_LINK_ACCEL:-unknown}"
          sccache --show-stats || true

  adl_demo_proof:
    name: adl-demo-proof
    needs: adl_path_policy
    if: needs.adl_path_policy.outputs.runtime_v3_fast_required != 'true' && (needs.adl_path_policy.outputs.demo_smoke_required == 'true' || needs.adl_path_policy.outputs.v0913_proof_required == 'true') && (needs.adl_path_policy.outputs.heavy_ci_backend != 'spot' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !contains(github.event.pull_request.labels.*.name, 'ci:spot'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain for tracked proof lane
        if: needs.adl_path_policy.outputs.v0913_proof_required == 'true'
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: demo smoke (S-01..S-05)
        if: needs.adl_path_policy.outputs.demo_smoke_required == 'true'
        run: bash adl/tools/demo_smoke_v07_story.sh

      - name: tracked proof validation lane
        if: needs.adl_path_policy.outputs.v0913_proof_required == 'true'
        run: bash adl/tools/run_v0913_proof_validation_lane.sh

      - name: Demo smoke skipped by path policy
        if: needs.adl_path_policy.outputs.demo_smoke_required != 'true'
        run: |
          echo "Demo smoke skipped because changed paths do not touch runtime or demo surfaces."
          echo "Policy reason: ${{ needs.adl_path_policy.outputs.reason }}"

      - name: tracked proof validation skipped by path policy
        if: needs.adl_path_policy.outputs.v0913_proof_required != 'true'
        run: |
          echo "Tracked proof validation skipped because changed paths do not touch tracked proof/demo packet surfaces."
          echo "Policy reason: ${{ needs.adl_path_policy.outputs.reason }}"
          echo "Proof validation scope: ${{ needs.adl_path_policy.outputs.proof_validation_scope }}"

  adl_spot_ci_and_coverage:
    name: adl-spot-ci-and-coverage
    needs: adl_path_policy
    if: needs.adl_path_policy.outputs.heavy_ci_backend == 'spot' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'ci:spot') && (needs.adl_path_policy.outputs.rust_required == 'true' || needs.adl_path_policy.outputs.demo_smoke_required == 'true' || needs.adl_path_policy.outputs.v0913_proof_required == 'true' || needs.adl_path_policy.outputs.coverage_required == 'true')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/aws-spot-remote-validation.yaml
    with:
      mode: start-run
      profile: ${{ needs.adl_path_policy.outputs.coverage_required == 'true' && 'adl-ci-and-coverage' || 'adl-ci' }}
      remote_ref: ${{ github.head_ref || github.ref_name }}
      git_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      base_ref: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      source_event_name: ${{ github.event_name }}
      instance_type: c7a.8xlarge
      builder_image_tag: v0.91.7-coverage-5243
      issue_number: ${{ github.event.pull_request.number }}
    secrets: inherit

  adl-ci:
    name: adl-ci
    needs:
      - adl_path_policy
      - adl_tooling_contracts
      - adl_runtime_v3_fast
      - adl_rust_fmt_clippy
      - adl_rust_tests
      - adl_demo_proof
      - adl_spot_ci_and_coverage
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository for route verification
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Aggregate split adl-ci lanes
        env:
          BACKEND: ${{ needs.adl_path_policy.outputs.heavy_ci_backend }}
          EVENT_NAME: ${{ github.event_name }}
          SAME_REPO_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          SPOT_OPT_IN: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:spot') }}
          WORK_REQUIRED: ${{ needs.adl_path_policy.outputs.rust_required == 'true' || needs.adl_path_policy.outputs.demo_smoke_required == 'true' || needs.adl_path_policy.outputs.v0913_proof_required == 'true' }}
          SPOT_WORK_REQUIRED: ${{ needs.adl_path_policy.outputs.rust_required == 'true' || needs.adl_path_policy.outputs.demo_smoke_required == 'true' || needs.adl_path_policy.outputs.v0913_proof_required == 'true' || needs.adl_path_policy.outputs.coverage_required == 'true' }}
          RUST_REQUIRED: ${{ needs.adl_path_policy.outputs.rust_required == 'true' }}
          DEMO_REQUIRED: ${{ needs.adl_path_policy.outputs.demo_smoke_required == 'true' || needs.adl_path_policy.outputs.v0913_proof_required == 'true' }}
        run: |
          set -euo pipefail
          python3 adl/tools/verify_ci_backend_route.py \
            --surface adl-ci \
            --backend "$BACKEND" \
            --event-name "$EVENT_NAME" \
            --same-repo-pr "$SAME_REPO_PR" \
            --spot-opt-in "$SPOT_OPT_IN" \
            --work-required "$WORK_REQUIRED" \
            --spot-work-required "$SPOT_WORK_REQUIRED" \
            --rust-required "$RUST_REQUIRED" \
            --demo-required "$DEMO_REQUIRED" \
            --path-policy-result "${{ needs.adl_path_policy.result }}" \
            --spot-result "${{ needs.adl_spot_ci_and_coverage.result }}" \
            --hosted-result "rust-fmt-clippy=${{ needs.adl_rust_fmt_clippy.result }}" \
            --hosted-result "rust-tests=${{ needs.adl_rust_tests.result }}" \
            --hosted-result "demo-proof=${{ needs.adl_demo_proof.result }}"
          failed=""
          for lane in \
            "adl_path_policy:${{ needs.adl_path_policy.result }}" \
            "adl_tooling_contracts:${{ needs.adl_tooling_contracts.result }}" \
            "adl_runtime_v3_fast:${{ needs.adl_runtime_v3_fast.result }}" \
            "adl_rust_fmt_clippy:${{ needs.adl_rust_fmt_clippy.result }}" \
            "adl_rust_tests:${{ needs.adl_rust_tests.result }}" \
            "adl_demo_proof:${{ needs.adl_demo_proof.result }}" \
            "adl_spot_ci_and_coverage:${{ needs.adl_spot_ci_and_coverage.result }}"
          do
            name="${lane%%:*}"
            result="${lane#*:}"
            echo "$name => $result"
            case "$result" in
              success|skipped)
                ;;
              *)
                failed="${failed}${failed:+, }${name}=${result}"
                ;;
            esac
          done
          {
            echo "## Split adl-ci result"
            echo
            echo "| Lane | Result |"
            echo "|---|---|"
            echo "| adl_path_policy | \`${{ needs.adl_path_policy.result }}\` |"
            echo "| adl_tooling_contracts | \`${{ needs.adl_tooling_contracts.result }}\` |"
            echo "| adl_runtime_v3_fast | \`${{ needs.adl_runtime_v3_fast.result }}\` |"
            echo "| adl_rust_fmt_clippy | \`${{ needs.adl_rust_fmt_clippy.result }}\` |"
            echo "| adl_rust_tests | \`${{ needs.adl_rust_tests.result }}\` |"
            echo "| adl_demo_proof | \`${{ needs.adl_demo_proof.result }}\` |"
            echo "| adl_spot_ci_and_coverage | \`${{ needs.adl_spot_ci_and_coverage.result }}\` |"
            echo
            echo "Stable required check \`adl-ci\` is an aggregator over parallel lanes."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$failed" ]; then
            echo "::error::split adl-ci lane failure(s): $failed"
            exit 1
          fi

  adl-slow-proof:
    needs: adl_path_policy
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.adl_path_policy.outputs.slow_proof_contract_required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: adl
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: |
            adl -> target
          cache-directories: |
            ~/.cache/sccache

      - name: Install cargo-nextest
        uses: taiki-e/install-action@e5c52b603cc5f5e9b52b6a43afad8e9fe0527090 # install-action
        with:
          tool: nextest@0.9.140

      - name: Slow proof shard
        run: |
          bash tools/run_slow_proof_family.sh --family all --run --partition "count:${{ matrix.shard }}/4"

  adl_coverage_hosted:
    name: adl-coverage-hosted
    needs: adl_path_policy
    if: needs.adl_path_policy.outputs.coverage_required == 'true' && (needs.adl_path_policy.outputs.heavy_ci_backend != 'spot' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !contains(github.event.pull_request.labels.*.name, 'ci:spot'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: adl
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: path-policy
        run: |
          bash adl/tools/ci_path_policy.sh \
            --event-name "${{ github.event_name }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --ref "${{ github.ref }}" \
            --github-output "$GITHUB_OUTPUT"
        working-directory: .

      - name: Validation profile summary (adl-coverage)
        run: |
          {
            echo "## ADL coverage validation profile"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| reason | \`${{ steps.path-policy.outputs.reason }}\` |"
            echo "| selected profile | \`${{ steps.path-policy.outputs.validation_profile_selected }}\` |"
            echo "| profile status | \`${{ steps.path-policy.outputs.validation_profile_status }}\` |"
            echo "| policy coverage lane | \`${{ steps.path-policy.outputs.coverage_lane }}\` |"
            echo "| policy coverage authority | \`${{ steps.path-policy.outputs.coverage_authority }}\` |"
            echo "| policy coverage execution state | \`${{ steps.path-policy.outputs.coverage_execution_state }}\` |"
            echo "| actual adl-coverage execution state | \`${{ steps.path-policy.outputs.coverage_execution_state }}\` |"
            echo "| profile run lanes | \`${{ steps.path-policy.outputs.validation_profile_run_lanes }}\` |"
            echo "| escalation required | \`${{ steps.path-policy.outputs.validation_profile_escalation_required }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: .

      - name: Determine PR fast coverage filters
        id: coverage-impact
        if: github.event_name == 'pull_request' && steps.path-policy.outputs.coverage_required == 'true' && !contains(github.event.pull_request.head.ref, 'csdlc-v2')
        run: |
          set -euo pipefail
          if ! test -x adl/tools/check_coverage_impact.sh; then
            echo "needs_fast_summary=false" >> "$GITHUB_OUTPUT"
            echo "filter_expression=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash adl/tools/check_coverage_impact.sh \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --print-risk-nextest-expression > adl/coverage-impact-filter-expression.txt
          if test -s adl/coverage-impact-filter-expression.txt; then
            echo "needs_fast_summary=true" >> "$GITHUB_OUTPUT"
            {
              echo "filter_expression<<ADL_COVERAGE_EXPR"
              cat adl/coverage-impact-filter-expression.txt
              echo "ADL_COVERAGE_EXPR"
            } >> "$GITHUB_OUTPUT"
          else
            echo "needs_fast_summary=false" >> "$GITHUB_OUTPUT"
            echo "filter_expression=" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .

      - name: Install Rust toolchain
        if: steps.path-policy.outputs.full_coverage_required == 'true' || steps.coverage-impact.outputs.needs_fast_summary == 'true'
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: llvm-tools-preview

      - name: Free runner disk space for coverage
        if: steps.path-policy.outputs.full_coverage_required == 'true' || steps.coverage-impact.outputs.needs_fast_summary == 'true'
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          df -h
        working-directory: .

      - name: Rust cache
        if: steps.path-policy.outputs.full_coverage_required == 'true' || steps.coverage-impact.outputs.needs_fast_summary == 'true'
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: |
            adl -> target
          cache-directories: |
            ~/.cache/sccache

      - name: Install cargo-llvm-cov
        if: steps.path-policy.outputs.full_coverage_required == 'true' || steps.coverage-impact.outputs.needs_fast_summary == 'true'
        uses: taiki-e/install-action@e5c52b603cc5f5e9b52b6a43afad8e9fe0527090 # cargo-llvm-cov

      - name: Install cargo-nextest for coverage
        if: steps.path-policy.outputs.full_coverage_required == 'true' || steps.coverage-impact.outputs.needs_fast_summary == 'true'
        uses: taiki-e/install-action@e5c52b603cc5f5e9b52b6a43afad8e9fe0527090 # install-action
        with:
          tool: nextest@0.9.140

      - name: Install sccache for coverage
        if: steps.path-policy.outputs.full_coverage_required == 'true' || steps.coverage-impact.outputs.needs_fast_summary == 'true'
        uses: taiki-e/install-action@e5c52b603cc5f5e9b52b6a43afad8e9fe0527090 # install-action
        with:
          tool: sccache

      - name: Install lld for coverage
        if: steps.path-policy.outputs.full_coverage_required == 'true' || steps.coverage-impact.outputs.needs_fast_summary == 'true'
        run: bash adl/tools/setup_required_coverage_toolchain.sh install-lld
        working-directory: .

      - name: Configure Rust acceleration for coverage
        if: steps.path-policy.outputs.full_coverage_required == 'true' || steps.coverage-impact.outputs.needs_fast_summary == 'true'
        id: coverage-toolchain
        run: |
          bash adl/tools/setup_required_coverage_toolchain.sh configure "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Verify required coverage toolchain
        if: steps.path-policy.outputs.full_coverage_required == 'true' || steps.coverage-impact.outputs.needs_fast_summary == 'true'
        run: bash adl/tools/setup_required_coverage_toolchain.sh verify
        working-directory: .

      - name: Coverage not required by path policy
        if: steps.path-policy.outputs.coverage_required != 'true'
        run: |
          echo "Rust coverage execution is not required for this changed surface."
          echo "Policy reason: ${{ steps.path-policy.outputs.reason }}"
          echo "Coverage lane: ${{ steps.path-policy.outputs.coverage_lane }}"
          echo "Coverage authority: ${{ steps.path-policy.outputs.coverage_authority }}"
          echo "Coverage execution state: ${{ steps.path-policy.outputs.coverage_execution_state }}"
      - name: Coverage run and summary (json)
        if: steps.path-policy.outputs.full_coverage_required == 'true'
        run: bash adl/tools/run_ci_step_with_log.sh --name "coverage-run-summary-json" --log-root ci-step-logs -- bash adl/tools/run_authoritative_coverage_lane.sh --authority "${{ steps.path-policy.outputs.coverage_authority }}" --event-name "${{ github.event_name }}"
        working-directory: .

      - name: PR fast coverage summary (json)
        if: github.event_name == 'pull_request' && steps.path-policy.outputs.coverage_required == 'true' && steps.path-policy.outputs.full_coverage_required != 'true' && steps.coverage-impact.outputs.needs_fast_summary == 'true'
        run: |
          set -euo pipefail
          if [ "${{ steps.path-policy.outputs.full_coverage_required }}" = "true" ] && [ -d /mnt ] && [ -w /mnt ]; then
            export ADL_PR_FAST_COVERAGE_BUILD_ROOT=/mnt/adl-pr-fast-coverage
          fi
          if [ -n "${ADL_PR_FAST_COVERAGE_BUILD_ROOT:-}" ]; then
            rm -rf "$ADL_PR_FAST_COVERAGE_BUILD_ROOT"
            mkdir -p "$ADL_PR_FAST_COVERAGE_BUILD_ROOT"
            echo "PR-fast coverage scratch target: $ADL_PR_FAST_COVERAGE_BUILD_ROOT"
          fi
          bash adl/tools/run_pr_fast_coverage_lane.sh --filter-expression "${{ steps.coverage-impact.outputs.filter_expression }}"
        working-directory: .

      - name: Upload ADL-owned coverage step logs
        if: always() && steps.path-policy.outputs.coverage_required == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adl-coverage-step-logs
          path: adl/ci-step-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Coverage-impact changed-source gate
        if: github.event_name == 'pull_request' && steps.path-policy.outputs.full_coverage_required == 'true'
        env:
          PER_FILE_LINE_THRESHOLD: "80"
        run: |
          summary_path="adl/coverage-summary.json"
          if [ -s adl/target/coverage-impact-summary.json ]; then
            summary_path="adl/target/coverage-impact-summary.json"
          fi
          bash adl/tools/check_coverage_impact.sh \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --summary "$summary_path" \
            --threshold "$PER_FILE_LINE_THRESHOLD"
        working-directory: .

      - name: PR coverage-impact preflight
        if: github.event_name == 'pull_request' && steps.path-policy.outputs.coverage_required == 'true' && steps.path-policy.outputs.full_coverage_required != 'true'
        env:
          PER_FILE_LINE_THRESHOLD: "80"
        run: |
          set -euo pipefail
          args=(
            --base "${{ github.event.pull_request.base.sha }}"
            --head "${{ github.event.pull_request.head.sha }}"
            --threshold "$PER_FILE_LINE_THRESHOLD"
          )
          if [ "${{ steps.coverage-impact.outputs.needs_fast_summary }}" = "true" ]; then
            args+=(--summary adl/target/coverage-impact-summary.json)
          else
            args+=(--require-summary-for-risk)
          fi
          bash adl/tools/check_coverage_impact.sh "${args[@]}"
        working-directory: .

      - name: Enforce coverage policy gates (workspace + per-file)
        if: github.event_name != 'pull_request' && steps.path-policy.outputs.full_coverage_required == 'true' && steps.path-policy.outputs.coverage_authority != 'pr_policy_surface_tooling_only'
        env:
          WORKSPACE_LINE_THRESHOLD: "90"
          PER_FILE_LINE_THRESHOLD: "80"
          EXCLUDE_FROM_FILE_FLOOR_REGEX: 'adl/src/runtime_v2/(a2a_adapter_boundary|access_control|acip_hardening|challenge|contract_registry_accessors)\.rs$'
        run: |
          set -eu
          bash adl/tools/enforce_coverage_gates.sh coverage-summary.json
        working-directory: .

      - name: Full workspace coverage gate deferred for PR
        if: github.event_name == 'pull_request' && steps.path-policy.outputs.full_coverage_required == 'true'
        run: |
          echo "Workspace coverage gate and lcov artifact generation are deferred for pull requests."
          echo "This PR ran the authoritative coverage pass plus changed-source coverage-impact validation."
          echo "Full workspace coverage gating remains required on push-to-main, nightly ratchet, and non-PR fail-closed events."
          echo "Policy reason: ${{ steps.path-policy.outputs.reason }}"
          echo "Coverage lane: ${{ steps.path-policy.outputs.coverage_lane }}"
          echo "Coverage authority: ${{ steps.path-policy.outputs.coverage_authority }}"
          echo "Policy coverage execution state: ${{ steps.path-policy.outputs.coverage_execution_state }}"
          echo "Actual adl-coverage execution state: ${{ steps.path-policy.outputs.coverage_execution_state }}"

      - name: Coverage (ADL Rust workspace lcov)
        if: github.event_name != 'pull_request' && steps.path-policy.outputs.full_coverage_required == 'true' && steps.path-policy.outputs.coverage_authority != 'pr_policy_surface_tooling_only'
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Coverage summary (text)
        if: github.event_name != 'pull_request' && steps.path-policy.outputs.full_coverage_required == 'true' && steps.path-policy.outputs.coverage_authority != 'pr_policy_surface_tooling_only'
        run: cargo llvm-cov report --summary-only | tee coverage-summary.txt

      - name: Verify generated lcov file
        if: github.event_name != 'pull_request' && steps.path-policy.outputs.full_coverage_required == 'true' && steps.path-policy.outputs.coverage_authority != 'pr_policy_surface_tooling_only'
        run: test -s lcov.info && ls -l lcov.info

      - name: Verify lcov path from repository root
        if: github.event_name != 'pull_request' && steps.path-policy.outputs.full_coverage_required == 'true' && steps.path-policy.outputs.coverage_authority != 'pr_policy_surface_tooling_only'
        run: test -s adl/lcov.info && ls -l adl/lcov.info
        working-directory: .

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' && steps.path-policy.outputs.full_coverage_required == 'true' && steps.path-policy.outputs.coverage_authority != 'pr_policy_surface_tooling_only'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adl-coverage-lcov
          path: |
            adl/lcov.info
            adl/coverage-summary.json
            adl/coverage-summary.txt
          if-no-files-found: error
      - name: Coverage artifact publication boundary
        if: github.event_name != 'pull_request' && steps.path-policy.outputs.full_coverage_required == 'true' && steps.path-policy.outputs.coverage_authority != 'pr_policy_surface_tooling_only'
        run: |
          echo "Coverage artifacts are CI/operator review surfaces."
          echo "Normalize runner-local paths and run redaction/publication review before reusing them in publication-adjacent or customer-facing packets."
        working-directory: .

      - name: Coverage policy annotation
        if: steps.path-policy.outputs.coverage_required != 'true'
        run: |
          echo "Path policy did not require Rust coverage for these changed paths."
          echo "The authoritative coverage command did not run in this job because coverage_required != true."
          echo "Policy reason: ${{ steps.path-policy.outputs.reason }}"
          echo "Coverage lane requested by policy: ${{ steps.path-policy.outputs.coverage_lane }}"
          echo "Coverage authority requested by policy: ${{ steps.path-policy.outputs.coverage_authority }}"
          echo "Actual adl-coverage execution state: skipped_by_path_policy"
        working-directory: .

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.path-policy.outputs.full_coverage_required == 'true'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: adl/lcov.info
          flags: adl
          # Keep CI signal stable during transient Codecov outages; upload is informational.
          fail_ci_if_error: false
          verbose: true

      - name: Rust acceleration stats for coverage
        if: always() && steps.coverage-toolchain.outputs.ready == 'true'
        run: bash adl/tools/setup_required_coverage_toolchain.sh stats
        working-directory: .

  adl-coverage:
    name: adl-coverage
    needs:
      - adl_path_policy
      - adl_coverage_hosted
      - adl_spot_ci_and_coverage
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository for route verification
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Aggregate hosted or Spot coverage lane
        env:
          BACKEND: ${{ needs.adl_path_policy.outputs.heavy_ci_backend }}
          EVENT_NAME: ${{ github.event_name }}
          SAME_REPO_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          SPOT_OPT_IN: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:spot') }}
          WORK_REQUIRED: ${{ needs.adl_path_policy.outputs.coverage_required == 'true' }}
          SPOT_WORK_REQUIRED: ${{ needs.adl_path_policy.outputs.coverage_required == 'true' }}
        run: |
          set -euo pipefail
          python3 adl/tools/verify_ci_backend_route.py \
            --surface adl-coverage \
            --backend "$BACKEND" \
            --event-name "$EVENT_NAME" \
            --same-repo-pr "$SAME_REPO_PR" \
            --spot-opt-in "$SPOT_OPT_IN" \
            --work-required "$WORK_REQUIRED" \
            --spot-work-required "$SPOT_WORK_REQUIRED" \
            --path-policy-result "${{ needs.adl_path_policy.result }}" \
            --spot-result "${{ needs.adl_spot_ci_and_coverage.result }}" \
            --hosted-result "coverage=${{ needs.adl_coverage_hosted.result }}"
          failed=""
          for lane in \
            "adl_path_policy:${{ needs.adl_path_policy.result }}" \
            "adl_coverage_hosted:${{ needs.adl_coverage_hosted.result }}" \
            "adl_spot_ci_and_coverage:${{ needs.adl_spot_ci_and_coverage.result }}"
          do
            name="${lane%%:*}"
            result="${lane#*:}"
            echo "$name => $result"
            case "$result" in
              success|skipped) ;;
              *) failed="${failed}${failed:+, }${name}=${result}" ;;
            esac
          done
          if [ -n "$failed" ]; then
            echo "::error::adl-coverage lane failure(s): $failed"
            exit 1
          fi
