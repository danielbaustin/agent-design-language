[package]
name = "adl-runtime"
version = "0.91.7"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "CSM runtime contracts and component topology for ADL"

[lib]
name = "adl_runtime"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
fs2 = "0.4"
hmac = "0.12"
rand = "0.8"
redb = "4.1"
secrecy = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
serde_jcs = "0.2"
subtle = "2.6"
prost = "0.13"
sysinfo = { version = "0.38.4", default-features = false, features = ["disk", "system"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
