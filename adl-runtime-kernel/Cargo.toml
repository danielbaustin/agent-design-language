[package]
name = "adl-runtime-kernel"
version = "0.92.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Independent supervised component runtime kernel proof for ADL"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.22"
blake3 = "1"
ed25519-dalek = "3"
futures = "0.3"
hex = "0.4"
lru = "0.16"
petgraph = "0.7"
prost = "0.13"
redb = "4.1"
rsntp = { version = "4.1.2", default-features = false }
semver = { version = "1", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_jcs = "0.2"
sha2 = "0.10"
socket2 = "0.6"
sysinfo = { version = "0.38.4", default-features = false, features = ["component", "disk", "network", "system"] }
thiserror = "1.0"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[dev-dependencies]
rand = "0.8"
rcgen = "0.14"
subtle = "2.6"
tempfile = "3"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

[[bin]]
name = "adl-runtime-kernel"
path = "src/bin/adl-runtime-kernel.rs"

[[bin]]
name = "adl-runtime-shadow-fixture"
path = "src/bin/adl-runtime-shadow-fixture.rs"
