[package]
name = "adl-cli"
version.workspace = true
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Thin ADL v2 CLI and authoritative generation selector"

[[bin]]
name = "adl-v2"
path = "src/main.rs"

[dependencies]
adl-compiler = { path = "../adl-compiler" }
adl-engine = { path = "../adl-engine" }
adl-language = { path = "../adl-language" }
adl-records = { path = "../adl-records" }
clap = { version = "4.6.1", features = ["derive", "env"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
fs2 = "0.4.3"
hex = "=0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
