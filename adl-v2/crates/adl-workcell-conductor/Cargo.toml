[package]
name = "adl-workcell-conductor"
version.workspace = true
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Pure deterministic workcell assignment planner for ADL v2"

[dependencies]
blake3 = "=1.8.5"
petgraph = "=0.8.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.18"

[lints.rust]
unsafe_code = "forbid"
