[package]
name = "adl-workcell-task-adapter"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Bounded Codex task and context-handoff transport for ADL v2"

[dependencies]
blake3 = "=1.8.5"
futures = "=0.3.33"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.18"
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"
