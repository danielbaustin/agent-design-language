[package]
name = "adl-runtime-v3-adapter"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Thin verified ADL v2 boundary for Runtime v3 canonical ingress"

[dependencies]
adl-engine = { path = "../adl-engine" }
adl-records = { path = "../adl-records" }
adl-runtime-kernel = { path = "../../../adl-runtime-kernel" }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[dev-dependencies]
ed25519-dalek = "=2.2.0"
tokio = { version = "=1.53.1", features = ["macros", "rt", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"
