  - id: ed25519-sign-verify-tamper
    disposition: approved_intentional_difference
    decision_ref: records-contract
    normalization:
      - {kind: canonical_json, step: sign, stream: stdout}
      - {kind: canonical_json, step: verify, stream: stdout}
      - {kind: canonical_json, step: tamper, stream: stdout}
    steps:
      - id: sign
        args:
          - sign
          - "{ROOT}/../v2/event-record.json"
          - --key-id
          - characterization-fixed
          - --key-hex
          - 2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a
        expected_exit: 0
        stdout_contains: ['"schema":"adl.sign.v1"', '"record_kind":"event"']
        capture_stdout_to: "{WORK}/signed.json"
        capture_stdout_json_field: result
      - id: verify
        args:
          - verify
          - "{WORK}/signed.json"
          - --public-key-hex
          - 197f6b23e16c8532c6abc838facd5ea789be0c76b2920334039bfa8b3d368d61
          - --logical-time
          - "10"
        expected_exit: 0
        stdout_contains: ['"schema":"adl.verify.v1"', '"record_kind":"event"']
      - id: tamper
        args:
          - verify
          - "{WORK}/signed.json"
          - --public-key-hex
          - 197f6b23e16c8532c6abc838facd5ea789be0c76b2920334039bfa8b3d368d61
          - --logical-time
          - "10"
        expected_exit: 2
        stdout_contains: ["payload digest mismatch"]
        pre_actions:
          - kind: replace_text
            path: "{WORK}/signed.json"
            from: '"detail":"ok"'
            to: '"detail":"tampered"'
