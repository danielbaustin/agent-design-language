decisions:
  cli-contract:
    owner_issue: 5345
    authority: adl-v2/crates/adl-cli/src/main.rs
    rationale: ADL v2 deliberately uses an explicit subcommand CLI and versioned JSON envelopes.
    replacement_proof: adl-v2/crates/adl-cli/tests/cli.rs
    risk: Operators must use the v2 command contract rather than legacy positional flags.
    reviewer: WP-10 exact-revision review
    rollback_impact: Keep the v1 executable selected if a consumer has not migrated its command shape.
  plan-contract:
    owner_issue: 5338
    authority: adl-v2/crates/adl-compiler/CHARACTERIZATION_PARITY.md
    rationale: ADL v2 replaces human plan, graph, and prompt projections with one typed execution-plan JSON envelope.
    replacement_proof: adl-v2/crates/adl-compiler/tests/characterization_parity.rs
    risk: Consumers must read the typed plan schema instead of scraping legacy text.
    reviewer: WP-05 exact-revision review
    rollback_impact: Keep the v1 executable selected for legacy text projection consumers.
  legacy-pattern:
    owner_issue: 5339
    authority: adl-v2/crates/adl-language/CHARACTERIZATION_PARITY.md
    rationale: Legacy top-level pattern syntax is explicitly rejected rather than silently reinterpreted.
    replacement_proof: adl-v2/crates/adl-language/tests/characterization_parity.rs
    risk: Legacy pattern documents require an explicit migration before v2 execution.
    reviewer: WP-04 exact-revision review
    rollback_impact: Keep the v1 executable selected for unmigrated pattern documents.
  diagnostic-contract:
    owner_issue: 5339
    authority: adl-v2/crates/adl-language/CHARACTERIZATION_PARITY.md
    rationale: ADL v2 preserves fail-closed rejection semantics with structured diagnostics and exit code 2.
    replacement_proof: adl-v2/crates/adl-language/tests/characterization_parity.rs
    risk: Consumers must parse structured error envelopes rather than legacy stderr prose.
    reviewer: WP-04 exact-revision review
    rollback_impact: Keep the v1 executable selected for consumers coupled to legacy diagnostics.
  engine-contract:
    owner_issue: 5340
    authority: adl-v2/crates/adl-engine/README.md
    rationale: ADL v2 run returns the deterministic engine contract and snapshot instead of a legacy local-mock summary.
    replacement_proof: adl-v2/crates/adl-engine/tests/compiler_fixture_mapping.rs
    risk: Consumers must migrate from summary text to the engine result envelope.
    reviewer: WP-06 exact-revision review
    rollback_impact: Keep the v1 executable selected for legacy run-summary consumers.
  records-contract:
    owner_issue: 5345
    authority: adl-v2/crates/adl-records/README.md
    rationale: ADL v2 signs typed records with hexadecimal keys and verifies the inner signed envelope.
    replacement_proof: adl-v2/crates/adl-records/tests/tamper_channel.rs
    risk: Document-level legacy signatures are not interchangeable with typed record envelopes.
    reviewer: WP-10 exact-revision review
    rollback_impact: Keep the v1 executable selected for legacy signed-document workflows.

