[package]
name = "adl-characterization"
version = "0.92.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Independent black-box characterization harness for pinned ADL v1 behavior"

[lib]
name = "adl_characterization"
path = "src/lib.rs"

[[bin]]
name = "adl-characterize"
path = "src/bin/adl-characterize.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2.1"
jsonschema = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
wait-timeout = "0.2"
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
