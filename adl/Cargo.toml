[package]
name = "adl"
version = "0.91.7"
edition = "2021"
default-run = "adl"
license = "MIT OR Apache-2.0"
description = "ADL (Agent Design Language) reference runtime and CLI"

[lib]
name = "adl"
path = "src/lib.rs"

[[bin]]
name = "adl"
path = "src/main.rs"

[[bin]]
name = "adl-runtime"
path = "src/bin/adl_runtime.rs"

[[bin]]
name = "csm"
path = "src/bin/csm.rs"

[[bin]]
name = "csmctl"
path = "src/bin/csmctl.rs"

[[bin]]
name = "adl-review"
path = "src/bin/adl_review.rs"

[[bin]]
name = "adl-process"
path = "src/bin/adl_process.rs"

[[bin]]
name = "adl-remote"
path = "src/bin/adl_remote.rs"

[[bin]]
name = "adl-aws-remote-validation"
path = "src/bin/adl_aws_remote_validation.rs"

[[bin]]
name = "adl-provider-adapter"
path = "tools/adl_provider_adapter.rs"

[[bin]]
name = "demo-adl-gws-native-drive-sync"
path = "src/bin/demo_adl_gws_native_drive_sync.rs"

[[bin]]
name = "adl-gws-context-mirror"
path = "src/bin/demo_adl_gws_context_mirror.rs"

[[bin]]
name = "run_wp12_acip_websocket_transport_proof"
path = "src/bin/run_wp12_acip_websocket_transport_proof.rs"

[features]
# Heavy runtime_v2 proof-materialization and CLI proof-smoke tests stay out of
# ordinary `cargo test` but remain covered by authoritative `--all-features`
# lanes such as cargo-llvm-cov.
slow-proof-runtime = []
slow-proof-private-state = []
slow-proof-observatory = []
slow-proof-security = []
slow-proof-tests = [
  "slow-proof-runtime",
  "slow-proof-private-state",
  "slow-proof-observatory",
  "slow-proof-security",
]
# Heavy `pr finish` temp-repo publication and sync integration tests stay out
# of ordinary `cargo test` but remain covered by authoritative `--all-features`
# lanes such as cargo-llvm-cov.
slow-finish-tests = []

[dependencies]
adl-runtime = { path = "../adl-runtime" }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Single-assignment global init (for schema caching)
once_cell = "1.19"

# Serialization / parsing
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
markdown = "1.0.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
libc = "0.2"
fs2 = "0.4"

# Errors
anyhow = "1.0"
thiserror = "1.0"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP (blocking)
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "blocking",
  "rustls-tls",
] }
aws-config = "1"
aws-sdk-budgets = "1"
aws-sdk-bedrockruntime = "1"
aws-sdk-costexplorer = "1"
aws-sdk-cloudwatchlogs = "1"
aws-sdk-ec2 = "1"
aws-sdk-eventbridge = "1"
aws-sdk-iam = "1"
aws-sdk-lambda = "1"
aws-sdk-servicequotas = "1"
aws-sdk-sns = "1"
aws-sdk-ssm = "1"
aws-sdk-sts = "1"
google-workspace = "0.22.5"
yup-oauth2 = "12"
async-trait = "0.1"
dirs = "5"
mime_guess2 = "2.3.1"
futures-util = "0.3.31"
octocrab = { version = "0.53", default-features = false, features = [
  "default-client",
  "jwt-rust-crypto",
  "rustls",
  "rustls-ring",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Shared async runtime floor for long-lived cadence, ACIP runtime work, and
# later bounded recurring verification on the existing ADL runtime.
tokio = { version = "1", features = ["fs", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = "0.24"
axum = "0.7"
tower = "0.5"
hyper = "1"

# JSON Schema (Option A)
schemars = "0.8"
jsonschema = "0.17"
base64 = "0.22"
ed25519-dalek = "2.1"
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
tiny_http = "0.12"
sha2 = "0.10"
zeroize = "1"
deadpool = { version = "0.13.0", default-features = false, features = ["unmanaged"] }
ntp-daemon = "0.3.7"
rsntp = "4.1.2"

[dev-dependencies]
loom = "0.7"
aws-smithy-http-client = { version = "1", features = ["test-util"] }
aws-smithy-runtime-api = "1"
aws-smithy-types = "1"
http = "1"
