card_update_rule:
  - Every opened WP must receive SIP, STP, SPP, VPP, SRP, and SOR cards.
  - SIP, STP, and SPP must be issue-specific and design-time ready before execution starts.
  - VPP must truthfully classify focused, slow, platform, and release proof lanes.
  - SRP and SOR must exist upfront but remain truthful to review and output lifecycle state.
  - Card edits must use editor skills and typed v2 commands.
  - SOR closeout must match live GitHub issue and PR truth.

delivery_standard:
  - Every issue must deliver its complete declared outcome at the exact reviewed revision; scaffolding, placeholders, and partial slices do not satisfy the issue unless the issue explicitly defines that bounded slice as the complete outcome.
  - Runtime, protocol, provider, consumer, migration, and integration issues require real working behavior and real positive and negative proof; fixtures, receipts, demo mode, synthetic success, and substituted providers cannot replace production-path evidence.
  - Documentation and planning issues must produce source-grounded, decision-ready artifacts with explicit owners, boundaries, dependencies, acceptance criteria, and executable next steps; prose that only restates intent is not useful completion.
  - Tooling and cleanup issues must show measured operator or maintainability value, preserve required behavior, and retain focused regression proof.
  - Every issue must test or explicitly disposition applicable failure, security, privacy, portability, recovery, and claim-boundary cases.
  - One exact-revision pre-PR review must have no unresolved actionable findings, and required CI must be green before merge.
  - WP-22 must reject any issue whose evidence does not meet this delivery standard.

