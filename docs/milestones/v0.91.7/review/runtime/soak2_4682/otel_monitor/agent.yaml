schema: adl.long_lived_agent_spec.v1
agent_instance_id: soak2-otel-monitor-agent
display_name: Soak 2 OTel Monitor Agent
state_root: state
workflow:
  kind: demo_adapter
  name: wp07_otel_monitor_probe
  run_args:
    provider_id: local_ollama
    model: gemma4:latest
heartbeat:
  interval_secs: 1
  max_cycles: 1
  stale_lease_after_secs: 60
safety:
  allow_network: false
  allow_broker: false
  allow_filesystem_writes_outside_state_root: false
  allow_real_world_side_effects: false
  require_public_artifact_sanitization: true
  financial_advice: false
  max_cycle_runtime_secs: 120
  max_consecutive_failures: 1
memory:
  namespace: soak2/otel-monitor-agent
  write_policy: append_only
