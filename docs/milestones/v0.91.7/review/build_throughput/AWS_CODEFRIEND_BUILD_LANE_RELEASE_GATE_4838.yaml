schema_version: adl.release_gate_disposition.v1
issue: 4838
decision: approved_for_draft_pr_publication
reviewer_or_review_mode: pre_pr_subagent_review_plus_local_release_gate_validation
changed_release_gate_surfaces:
  - .github/workflows/aws-codefriend-build.yaml
focused_validation_run: >
  Focused local proof passed: bash adl/tools/test_run_aws_codefriend_build_lane.sh;
  bash adl/tools/test_select_validation_lanes.sh; workflow YAML parse; git diff
  --check; and a dry-run Agent Logic account-hash check with
  ADL_AWS_PROFILE=agent-logic-admin.
residual_ci_proof_required_before_merge: >
  GitHub Actions dispatch and live CodeBuild start-build remain residual CI/AWS
  proof. The workflow is manual-dispatch only, and live start-build is
  fail-closed until AWS_CODEFRIEND_CODEBUILD_PROJECT,
  AWS_CODEFRIEND_BUILD_ROLE_ARN, AWS_CODEFRIEND_ACCOUNT_SHA256, and an Agent
  Logic CodeBuild project exist.
notes:
  - The release-gate surface is a new manual workflow, not a change to ordinary PR or push CI.
  - The workflow uses GitHub OIDC with id-token write and contents read permissions.
  - The repo-native wrapper requires account-hash verification for every live run.
